<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0c0f"
    >

    <title>Revenge Plugin</title>


    <style>

        :root {

            --background: #0b0c0f;
            --surface: #111318;

            --border: #242833;
            --border-hover: #363c49;

            --text: #f1f3f5;
            --muted: #9299a6;
            --dim: #666d79;

            --max-width: 850px;

        }


        * {
            box-sizing: border-box;
        }


        html {
            background: var(--background);
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255,255,255,.045),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size: 15px;
            line-height: 1.6;

        }


        a {
            color: inherit;
            text-decoration: none;
        }


        .container {

            width:
                min(
                    calc(100% - 40px),
                    var(--max-width)
                );

            margin: auto;

        }


        /* Header */

        header {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid var(--border);

        }


        .brand {

            font-weight: 700;

            letter-spacing: -.02em;

        }


        .brand span {

            color: var(--muted);

            font-weight: 500;

        }


        .github {

            color: var(--muted);

            font-size: 14px;

        }


        .github:hover {
            color: var(--text);
        }


        /* Back */

        .back {

            display: inline-flex;

            margin-top: 45px;

            color: var(--muted);

            font-size: 14px;

        }


        .back:hover {
            color: var(--text);
        }


        /* Hero */

        .hero {

            padding:
                28px 0 48px;

        }


        .plugin-id {

            margin-bottom: 13px;

            color: var(--dim);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: .08em;

        }


        h1 {

            margin:
                0 0 15px;

            font-size:
                clamp(
                    36px,
                    6vw,
                    54px
                );

            line-height: 1.05;

            letter-spacing: -.045em;

        }


        .description {

            max-width: 680px;

            margin: 0;

            color: var(--muted);

            font-size: 17px;

        }


        .badges {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 22px;

        }


        .badge {

            padding:
                5px 9px;

            background: var(--surface);

            border:
                1px solid var(--border);

            border-radius: 6px;

            color: var(--muted);

            font-size: 12px;

        }


        /* Sections */

        .section {

            padding:
                30px 0;

            border-top:
                1px solid var(--border);

        }


        h2 {

            margin:
                0 0 14px;

            font-size: 15px;

        }


        /* Install */

        .install {

            display: flex;

            gap: 9px;

        }


        .url {

            flex: 1;

            min-width: 0;

            padding:
                12px 13px;

            background: var(--surface);

            border:
                1px solid var(--border);

            border-radius: 8px;

            color: var(--muted);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                monospace;

            font-size: 12px;

            white-space: nowrap;

            overflow-x: auto;

        }


        button {

            padding:
                0 15px;

            background:
                #e9edf2;

            border: 0;

            border-radius: 8px;

            color:
                #0b0c0f;

            font-weight: 650;

            cursor: pointer;

        }


        button:hover {
            background: white;
        }


        /* Authors */

        .authors {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }


        .author {

            padding:
                5px 9px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius: 6px;

            color: var(--muted);

            font-size: 13px;

        }


        /* Source */

        .source {

            color: var(--muted);

        }


        .source:hover {
            color: var(--text);
        }


        /* Error */

        .error {

            padding:
                70px 0;

            color: var(--muted);

        }


        /* Toast */

        .toast {

            position: fixed;

            left: 50%;

            bottom: 24px;

            transform:
                translateX(-50%)
                translateY(10px);

            padding:
                8px 13px;

            background:
                #f1f3f5;

            color:
                #0b0c0f;

            border-radius: 7px;

            font-size: 13px;

            font-weight: 600;

            opacity: 0;

            pointer-events: none;

            transition: .18s;

        }


        .toast.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        /* Mobile */

        @media(max-width:650px) {

            .container {

                width:
                    min(
                        calc(100% - 28px),
                        var(--max-width)
                    );

            }


            header {
                height: 62px;
            }


            .install {

                flex-direction: column;

            }


            .install button {

                height: 42px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <header>

        <a
            class="brand"
            href="../"
        >
            fshinz
            <span>/ Revenge Plugins</span>
        </a>


        <a
            class="github"
            href="https://github.com/fshinz/Revenge-Plugins"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub
        </a>

    </header>


    <main id="app">


        <a
            class="back"
            href="../"
        >
            ← All plugins
        </a>


        <section class="hero">

            <div
                id="plugin-id"
                class="plugin-id"
            >
                PLUGIN
            </div>


            <h1 id="plugin-name">
                Loading…
            </h1>


            <p
                id="description"
                class="description"
            ></p>


            <div
                id="badges"
                class="badges"
            ></div>

        </section>


        <section class="section">

            <h2>
                Installation
            </h2>


            <div class="install">

                <div
                    id="plugin-url"
                    class="url"
                ></div>


                <button id="copy">
                    Copy URL
                </button>

            </div>

        </section>


        <section class="section">

            <h2>
                Authors
            </h2>


            <div
                id="authors"
                class="authors"
            ></div>

        </section>


        <section class="section">

            <a
                id="source"
                class="source"
                target="_blank"
                rel="noopener noreferrer"
            >
                View source on GitHub →
            </a>

        </section>


    </main>


    <div
        id="toast"
        class="toast"
    ></div>


</div>


<script>


/*
    The folder name from:

    /Revenge-Plugins/NoDelete+/

    becomes:

    NoDelete+
*/


const pluginName =
    decodeURIComponent(
        location.pathname
            .replace(/\/+$/, "")
            .split("/")
            .pop() || ""
    );


const toast =
    document.getElementById("toast");


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(
            () => toast.classList.remove("show"),
            1500
        );

}


async function copyUrl() {

    const url =
        document.getElementById(
            "plugin-url"
        ).textContent;


    try {

        await navigator.clipboard.writeText(url);

        showToast("Plugin URL copied");

    } catch {

        showToast("Couldn't copy URL");

    }

}


async function loadPlugin() {

    try {

        /*
            Each plugin has:

            /PluginName/manifest.json
        */

        const response =
            await fetch(
                "./manifest.json"
            );


        if (!response.ok) {

            throw new Error(
                "manifest.json not found"
            );

        }


        const manifest =
            await response.json();


        const name =
            manifest.name ||
            pluginName ||
            "Revenge Plugin";


        const version =
            manifest.version ||
            "";


        const description =
            manifest.description ||
            "No description available.";


        const url =
            "https://fshinz.github.io/Revenge-Plugins/" +
            encodeURI(pluginName) +
            "/";


        document.title =
            name +
            " · Revenge Plugins";


        document.getElementById(
            "plugin-id"
        ).textContent =
            pluginName;


        document.getElementById(
            "plugin-name"
        ).textContent =
            name;


        document.getElementById(
            "description"
        ).textContent =
            description;


        document.getElementById(
            "plugin-url"
        ).textContent =
            url;


        document.getElementById(
            "copy"
        ).addEventListener(
            "click",
            copyUrl
        );


        document.getElementById(
            "badges"
        ).innerHTML = `

            ${
                version
                    ? `
                        <span class="badge">
                            v${escapeHtml(version)}
                        </span>
                    `
                    : ""
            }

            <span class="badge">
                Revenge plugin
            </span>

        `;


        const authors =
            Array.isArray(
                manifest.authors
            )
                ? manifest.authors
                : [];


        document.getElementById(
            "authors"
        ).innerHTML =

            authors.length

                ? authors
                    .map(author => {

                        const authorName =
                            typeof author === "string"
                                ? author
                                : author.name;

                        return `
                            <span class="author">
                                ${escapeHtml(
                                    authorName ||
                                    "Unknown"
                                )}
                            </span>
                        `;

                    })
                    .join("")

                : `
                    <span class="description">
                        No author information.
                    </span>
                `;


        /*
            GitHub source link
        */

        document.getElementById(
            "source"
        ).href =
            "https://github.com/fshinz/Revenge-Plugins/tree/master/" +
            encodeURI(pluginName);


    } catch (error) {

        console.error(error);


        document.getElementById(
            "app"
        ).innerHTML = `

            <a
                class="back"
                href="../"
            >
                ← All plugins
            </a>


            <div class="error">

                <h1>
                    Plugin not found
                </h1>

                <p>
                    There is no valid
                    manifest.json at this URL.
                </p>

            </div>

        `;

    }

}


/* Escape HTML */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[character]));

}


loadPlugin();

</script>


</body>
</html>

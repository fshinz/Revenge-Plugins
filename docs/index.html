<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c0f">
<meta name="description" content="fshinz's Revenge plugins">
<title>fshinz / Revenge Plugins</title>

<style>
:root {
--background: #0b0c0f;
--surface: #111318;
--surface-hover: #151820;

--border: #242833;
--border-hover: #363c49;

--text: #f1f3f5;
--muted: #9299a6;
--dim: #666d79;

--max-width: 1050px;
}

* {
box-sizing: border-box;
}

html {
background: var(--background);
}

body {
margin: 0;
min-height: 100vh;

background:
radial-gradient(
circle at 50% -20%,
rgba(255, 255, 255, 0.045),
transparent 35%
),
var(--background);

color: var(--text);

font-family:
Inter,
ui-sans-serif,
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

font-size: 15px;
line-height: 1.6;
}

a {
color: inherit;
text-decoration: none;
}

button,
input {
font: inherit;
}

.container {
width: min(calc(100% - 40px), var(--max-width));
margin: 0 auto;
}

/* Header */

header {
height: 72px;
display: flex;
align-items: center;
justify-content: space-between;

border-bottom: 1px solid var(--border);
}

.brand {
font-weight: 700;
letter-spacing: -0.02em;
}

.brand span {
color: var(--muted);
font-weight: 500;
}

.github-link {
color: var(--muted);
font-size: 14px;
transition: color 0.15s ease;
}

.github-link:hover {
color: var(--text);
}

/* Hero */

.hero {
padding: 82px 0 48px;
}

.eyebrow {
color: var(--muted);
font-size: 13px;
margin-bottom: 12px;
}

h1 {
margin: 0 0 16px;

font-size: clamp(36px, 6vw, 58px);
line-height: 1.02;
letter-spacing: -0.045em;
}

.hero-description {
max-width: 650px;
margin: 0;

color: var(--muted);
font-size: 17px;
}

/* Toolbar */

.toolbar {
display: flex;
align-items: center;
justify-content: space-between;

gap: 12px;
margin-bottom: 20px;
}

.plugin-count {
color: var(--dim);
font-size: 13px;
}

.search {
width: 330px;

padding: 11px 13px;

background: var(--surface);

border: 1px solid var(--border);
border-radius: 9px;

outline: none;
color: var(--text);
}

.search::placeholder {
color: var(--dim);
}

.search:focus {
border-color: var(--border-hover);
}

/* Plugin grid */

.plugins {
display: grid;

grid-template-columns:
repeat(2, minmax(0, 1fr));

gap: 10px;
}

.plugin {
display: block;

padding: 19px 20px;

background: var(--surface);

border: 1px solid var(--border);
border-radius: 10px;

transition:
transform 0.15s ease,
background 0.15s ease,
border-color 0.15s ease;
}

.plugin:hover {
transform: translateY(-1px);

background: var(--surface-hover);
border-color: var(--border-hover);
}

.plugin-header {
display: flex;
align-items: flex-start;
justify-content: space-between;

gap: 12px;
}

.plugin-name {
font-size: 16px;
font-weight: 650;

letter-spacing: -0.015em;
}

.plugin-version {
color: var(--dim);

font-family:
ui-monospace,
SFMono-Regular,
Menlo,
monospace;

font-size: 12px;
white-space: nowrap;
}

.plugin-description {
min-height: 43px;

margin: 7px 0 18px;

color: var(--muted);
font-size: 13.5px;
}

.plugin-footer {
display: flex;
align-items: center;
justify-content: space-between;

color: var(--dim);
font-size: 12px;
}

.copy-button {
padding: 5px 9px;

border: 1px solid var(--border);
border-radius: 6px;

background: transparent;
color: var(--muted);

cursor: pointer;

transition:
color 0.15s ease,
border-color 0.15s ease;
}

.copy-button:hover {
color: var(--text);
border-color: var(--border-hover);
}

/* Empty state */

.empty {
grid-column: 1 / -1;

padding: 45px;

text-align: center;

color: var(--muted);

border: 1px dashed var(--border);
border-radius: 10px;
}

/* Footer */

footer {
margin-top: 70px;
padding: 28px 0 40px;

border-top: 1px solid var(--border);

color: var(--dim);
font-size: 13px;
}

footer a {
color: var(--dim);
}

footer a:hover {
color: var(--text);
}

/* Toast */

.toast {
position: fixed;

left: 50%;
bottom: 24px;

transform:
translateX(-50%)
translateY(10px);

padding: 8px 13px;

background: #f1f3f5;
color: #0b0c0f;

border-radius: 7px;

font-size: 13px;
font-weight: 600;

opacity: 0;
pointer-events: none;

transition: 0.18s ease;
}

.toast.visible {
opacity: 1;

transform:
translateX(-50%)
translateY(0);
}

/* Mobile */

@media (max-width: 700px) {

.container {
width: min(
calc(100% - 28px),
var(--max-width)
);
}

header {
height: 62px;
}

.hero {
padding: 58px 0 38px;
}

.toolbar {
align-items: stretch;
flex-direction: column;
}

.search {
width: 100%;
}

.plugins {
grid-template-columns: 1fr;
}

}
</style>
</head>

<body>

<div class="container">

<header>

<a class="brand" href="./">
fshinz <span>/ Revenge Plugins</span>
</a>

<a
class="github-link"
href="https://github.com/fshinz/Revenge-Plugins"
target="_blank"
rel="noopener noreferrer"
>
GitHub
</a>

</header>

<main>

<section class="hero">

<div class="eyebrow">
REVENGE PLUGINS
</div>

<h1>
Small plugins.<br>
Useful changes.
</h1>

<p class="hero-description">
A collection of plugins made for Revenge.
Pick a plugin to view its details and installation URL.
</p>

</section>

<section>

<div class="toolbar">

<div
id="plugin-count"
class="plugin-count"
>
Loading plugins…
</div>

<input
id="search"
class="search"
type="search"
placeholder="Search plugins…"
autocomplete="off"
>

</div>

<div
id="plugins"
class="plugins"
>

<div class="empty">
Loading plugins…
</div>

</div>

</section>

</main>

<footer>

Built by fshinz ·

<a
href="https://github.com/fshinz/Revenge-Plugins"
target="_blank"
rel="noopener noreferrer"
>
source on GitHub
</a>

</footer>

</div>

<div
id="toast"
class="toast"
></div>

<script>

const BASE_URL =
"https://fshinz.github.io/Revenge-Plugins";

const GITHUB_API =
"https://api.github.com/repos/fshinz/Revenge-Plugins/contents?ref=gh-pages";

const pluginsContainer =
document.getElementById("plugins");

const searchInput =
document.getElementById("search");

const pluginCount =
document.getElementById("plugin-count");

const toast =
document.getElementById("toast");

let plugins = [];

/* Escape HTML */

function escapeHtml(value) {

return String(value ?? "")
.replace(/[&<>"']/g, character => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#039;"
}[character]));

}

/* Plugin URL */

function getPluginUrl(id) {

return (
BASE_URL +
"/" +
encodeURI(id) +
"/"
);

}

/* Toast */

function showToast(message) {

toast.textContent = message;

toast.classList.add("visible");

clearTimeout(showToast.timeout);

showToast.timeout =
setTimeout(() => {

toast.classList.remove("visible");

}, 1500);

}

/* Copy URL */

async function copyPluginUrl(url, event) {

event.preventDefault();
event.stopPropagation();

try {

await navigator.clipboard.writeText(url);

showToast("Plugin URL copied");

} catch {

showToast("Couldn't copy URL");

}

}

/* Render plugins */

function renderPlugins() {

const query =
searchInput.value
.trim()
.toLowerCase();

const filtered =
plugins.filter(plugin => {

return (
plugin.name
.toLowerCase()
.includes(query)

||

plugin.description
.toLowerCase()
.includes(query)
);

});

pluginCount.textContent =
query
? `${filtered.length} of ${plugins.length} plugins`
: `${plugins.length} plugin${plugins.length === 1 ? "" : "s"}`;

if (!filtered.length) {

pluginsContainer.innerHTML = `
<div class="empty">
${
plugins.length
? "No plugins match that search."
: "No plugins found."
}
</div>
`;

return;

}

pluginsContainer.innerHTML =
filtered.map(plugin => {

const url =
getPluginUrl(plugin.id);

return `

<a
class="plugin"
href="${url}"
>

<div class="plugin-header">

<div class="plugin-name">
${escapeHtml(plugin.name)}
</div>

<div class="plugin-version">
${
plugin.version
? "v" + escapeHtml(plugin.version)
: "latest"
}
</div>

</div>

<div class="plugin-description">
${escapeHtml(
plugin.description ||
"No description available."
)}
</div>

<div class="plugin-footer">

<span>
${escapeHtml(plugin.id)}
</span>

<button
class="copy-button"
onclick='copyPluginUrl(
${JSON.stringify(url)},
event
)'
>
Copy URL
</button>

</div>

</a>
`;

}).join("");

}

/* Load plugins */

async function loadPlugins() {

try {

const response =
await fetch(
GITHUB_API,
{
headers: {
Accept:
"application/vnd.github+json"
}
}
);

if (!response.ok) {
throw new Error("GitHub API error");
}

const files =
await response.json();

const folders =
files.filter(file =>
file.type === "dir" &&
file.name !== ".github" &&
!file.name.startsWith(".")
);

const loaded =
await Promise.all(

folders.map(async folder => {

try {

const response =
await fetch(
`${BASE_URL}/${encodeURI(folder.name)}/manifest.json`
);

if (!response.ok) {
return null;
}

const manifest =
await response.json();

return {

id:
folder.name,

name:
manifest.name ||
folder.name,

description:
manifest.description ||
"",

version:
manifest.version ||
""

};

} catch {

return null;

}

})

);

plugins =
loaded
.filter(Boolean)
.sort((a, b) =>
a.name.localeCompare(
b.name,
undefined,
{
sensitivity: "base"
}
)
);

renderPlugins();

} catch (error) {

console.error(error);

pluginCount.textContent =
"Couldn't load plugins";

pluginsContainer.innerHTML = `
<div class="empty">
GitHub's API couldn't be reached right now.
</div>
`;

}

}

searchInput.addEventListener(
"input",
renderPlugins
);

loadPlugins();

</script>

</body>
</html>
